<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="喺瀏覽器入面把 PDF 翻開睇。檔案只會留喺你部裝置，唔會上傳。">
  <title>翻頁書</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="landing">
    <div class="landing-card">
      <svg class="mark" viewBox="0 0 72 56" aria-hidden="true">
        <rect x="4" y="4" width="30" height="48" rx="2" fill="#fff" stroke="#7c2f27" stroke-width="2"/>
        <rect x="38" y="4" width="30" height="48" rx="2" fill="#fffdf8" stroke="#7c2f27" stroke-width="2"/>
        <path d="M34 6c2 8 2 36 0 44" fill="none" stroke="#7c2f27" stroke-width="2"/>
      </svg>
      <h1>翻頁書</h1>
      <p class="lead">揀一份 PDF，好似揭書咁一頁頁睇。</p>
      <div class="actions">
        <button type="button" class="choose" id="choose-btn">揀 PDF 檔</button>
        <button type="button" class="sample" id="sample-btn">試睇範例</button>
      </div>
      <p class="drop-hint">或者將檔案拖放到呢度</p>
      <p class="sample-hint">範例喺瀏覽器入面產生，唔使揀檔。</p>
      <p class="note">檔案只會留喺你部裝置，唔會上傳到任何地方。</p>
      <p class="landing-error" id="landing-error" role="alert"></p>
    </div>
  </main>

  <div id="reader" hidden>
    <header class="topbar">
      <h1 class="brand">翻頁書</h1>
      <p id="doc-title"></p>
    </header>
    <div id="stage">
      <div id="book-mount"></div>
    </div>
    <p id="hint"></p>
    <footer class="toolbar">
      <div class="toolbar-row">
        <button type="button" class="tool" id="btn-first">第一頁</button>
        <button type="button" class="tool" id="btn-prev">上一頁</button>
        <button type="button" class="tool indicator" id="btn-indicator" aria-label="跳去第幾頁">1 / 1</button>
        <button type="button" class="tool" id="btn-next">下一頁</button>
        <button type="button" class="tool" id="btn-last">最後一頁</button>
      </div>
      <div class="toolbar-row">
        <button type="button" class="tool" id="btn-zoom-out">縮細</button>
        <span id="zoom-label">100%</span>
        <button type="button" class="tool" id="btn-zoom-in">放大</button>
        <button type="button" class="tool" id="btn-full">全螢幕</button>
        <button type="button" class="tool" id="btn-open">開另一本</button>
      </div>
    </footer>
  </div>

  <div id="loader" hidden>
    <div class="loader-card" role="status" aria-live="polite">
      <p id="loader-text">正在讀取檔案…</p>
      <div class="track"><div id="loader-bar" class="indeterminate"></div></div>
    </div>
  </div>

  <div id="jump-layer" hidden role="dialog" aria-modal="true" aria-labelledby="jump-title">
    <form id="jump-form">
      <h2 id="jump-title">跳去第幾頁</h2>
      <label>頁碼
        <input id="jump-input" type="number" inputmode="numeric" min="1" step="1" required>
      </label>
      <p id="jump-help"></p>
      <p id="jump-error" role="alert"></p>
      <div class="dialog-row">
        <button type="button" id="jump-cancel">取消</button>
        <button type="submit" id="jump-go">跳去</button>
      </div>
    </form>
  </div>

  <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>

  <script src="vendor/page-flip/page-flip.browser.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
